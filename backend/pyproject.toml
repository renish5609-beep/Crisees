[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crisees-backend"
version = "0.1.0"
description = "Crisees: equity-aware flood evacuation accessibility platform (API + data pipeline)"
requires-python = ">=3.11"
# Core = what the API needs at runtime (kept lean for serverless bundles).
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pyarrow>=16",
  "networkx>=3.2",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
# Data download/processing pipeline (scripts/download_data.py, process_data.py).
pipeline = ["osmnx>=2.0", "pyogrio>=0.9", "requests>=2.31"]
# Long-running server (Docker / local development).
server = ["uvicorn[standard]>=0.30"]
dev = ["pytest>=8", "httpx>=0.27", "osmnx>=2.0", "pyogrio>=0.9", "requests>=2.31", "uvicorn[standard]>=0.30"]

[tool.setuptools.packages.find]
include = ["app*", "pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.vercel.scripts]
build = "python vercel_build.py"
